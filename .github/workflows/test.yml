name: test

# Runs on the public mirror github.com/Kugelaudio/cpp-sdk. Builds the library,
# the examples and the tests, runs them with CTest, and checks that an
# installed package works with find_package. No secrets: the live test skips
# itself without KUGELAUDIO_API_KEY.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: clang-format
        run: |
          pipx run --spec clang-format==23.1.3 clang-format --dry-run --Werror \
            $(git ls-files '*.cpp' '*.hpp')

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libcurl4-openssl-dev libssl-dev zlib1g-dev \
            nlohmann-json3-dev libgtest-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja nlohmann-json googletest

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DKUGELAUDIO_BUILD_TESTS=ON -DKUGELAUDIO_BUILD_EXAMPLES=ON
          -DCMAKE_INSTALL_PREFIX="${{ runner.temp }}/kugelaudio-prefix"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install and build a find_package consumer
        run: |
          cmake --install build
          cmake -S tests/consumer -B build-consumer -G Ninja \
            -DCMAKE_PREFIX_PATH="${{ runner.temp }}/kugelaudio-prefix"
          cmake --build build-consumer
          ./build-consumer/kugelaudio_consumer
